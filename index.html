<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeren'e Mektup</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311026 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent: #f43f5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 680px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            position: relative;
            z-index: 10;
            animation: fadeIn 1.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .date {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 500;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .content {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .content p {
            margin-bottom: 20px;
        }
        .signature {
            text-align: right;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--text-main);
        }
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .heart {
            position: absolute;
            bottom: -20px;
            background-color: rgba(244, 63, 94, 0.6);
            transform: rotate(45deg);
            animation: floatUp 6s linear infinite;
        }
        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: inherit;
            border-radius: 50%;
        }
        .heart::before { top: -50%; left: 0; }
        .heart::after { top: 0; left: -50%; }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(45deg) scale(0.6); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(45deg) scale(1.2); opacity: 0; }
        }
        @media(max-width: 600px) {
            .container { padding: 24px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="hearts-container" id="heartsContainer"></div>
    <div class="container">
        <div class="header">
            <div class="date">12 Haziran 2022</div>
            <h1>Zeren'e</h1>
        </div>
        <div class="content">
            <p>Mektubunuzun metnini buradaki paragrafların arasına ekleyebilirsiniz...</p>
        </div>
        <div class="signature">
            Sevgiyle...
        </div>
    </div>

    <script>
        function createHeart() {
            const container = document.getElementById('heartsContainer');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            const size = Math.random() * 12 + 8;
            heart.style.width = `${size}px`;
            heart.style.height = `${size}px`;
            heart.style.left = `${Math.random() * 100}vw`;
            heart.style.animationDuration = `${Math.random() * 4 + 4}s`;
            heart.style.animationDelay = `${Math.random() * 2}s`;
            
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 8000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>
